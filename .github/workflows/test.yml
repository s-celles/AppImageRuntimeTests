name: AppImage Runtime Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      runtime_url:
        description: "URL to download runtime from (e.g. for PR testing)"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            libc: gnu
            experimental: false
          - arch: x86_64
            libc: musl
            experimental: false
          - arch: i686
            libc: gnu
            experimental: false
          - arch: i686
            libc: musl
            experimental: false
          - arch: aarch64
            libc: gnu
            experimental: false
          - arch: aarch64
            libc: musl
            experimental: false
          - arch: armv6l
            libc: gnueabihf
            experimental: true
          - arch: armv6l
            libc: musleabihf
            experimental: true
          - arch: armv7l
            libc: gnueabihf
            experimental: false
          - arch: armv7l
            libc: musleabihf
            experimental: false
          - arch: powerpc64le
            libc: gnu
            experimental: true
          - arch: riscv64
            libc: gnu
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc gcc-i686-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-powerpc64le-linux-gnu gcc-riscv64-linux-gnu \
            libc6-dev squashfs-tools zstd file curl \
            qemu-user-static qemu-user \
            fuse libfuse2

      - name: Set up QEMU
        if: matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3

      - name: Compile test application
        run: ./scripts/build_test_app.sh ${{ matrix.arch }} test_app_${{ matrix.arch }}

      - name: Download runtime
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
        run: ./scripts/download_runtime.sh ${{ matrix.arch }} ${{ matrix.libc }}

      - name: Build AppImages
        run: |
          ./scripts/build_appimage.sh runtime-${{ matrix.arch }}-${{ matrix.libc }} test_app_${{ matrix.arch }} gzip test_gzip.AppImage
          ./scripts/build_appimage.sh runtime-${{ matrix.arch }}-${{ matrix.libc }} test_app_${{ matrix.arch }} zstd test_zstd.AppImage

      - name: Test runtime (Level 1)
        run: |
          echo "Running runtime directly to test structural validity"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            qemu-aarch64-static ./runtime-${{ matrix.arch }}-${{ matrix.libc }} --appimage-help || true
          elif [ "${{ matrix.arch }}" = "armv6l" ]; then
            qemu-arm-static ./runtime-${{ matrix.arch }}-${{ matrix.libc }} --appimage-help || true
          elif [ "${{ matrix.arch }}" = "armv7l" ]; then
            qemu-arm-static ./runtime-${{ matrix.arch }}-${{ matrix.libc }} --appimage-help || true
          elif [ "${{ matrix.arch }}" = "powerpc64le" ]; then
            qemu-ppc64le-static ./runtime-${{ matrix.arch }}-${{ matrix.libc }} --appimage-help || true
          elif [ "${{ matrix.arch }}" = "riscv64" ]; then
            qemu-riscv64-static ./runtime-${{ matrix.arch }}-${{ matrix.libc }} --appimage-help || true
          else
            ./runtime-${{ matrix.arch }}-${{ matrix.libc }} --appimage-help || true
          fi

      - name: Test AppImage with gzip (Level 2)
        run: ./scripts/test_appimage.sh test_gzip.AppImage ${{ matrix.arch }}

      - name: Test AppImage with zstd (Level 2)
        run: ./scripts/test_appimage.sh test_zstd.AppImage ${{ matrix.arch }}
